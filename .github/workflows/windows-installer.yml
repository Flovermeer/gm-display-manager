name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Select stable Rust
        run: rustup default stable

      - name: Install locked dependencies
        run: npm ci

      - name: Run Angular tests
        run: npm test -- --watch=false

      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: beholders-inn-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish private repository release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.app-version.outputs.version }}"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          gh release create $tag $installer.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Beholder's Inn $tag" `
            --generate-notes `
            --latest
