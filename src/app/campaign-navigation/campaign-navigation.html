<nav class="campaign-navigation" aria-label="Navigation de la campagne">
  <a class="brand-link" routerLink="/campaigns" aria-label="Retour à l'accueil des campagnes">
    <span class="brand-mark" aria-hidden="true"><span></span></span>
    <span class="brand-name">Beholder's Inn</span>
  </a>

  <p class="campaign-name" [title]="campaignName()">{{ campaignName() }}</p>

  <div class="campaign-links">
    <a [class.active]="activeSection() === 'control'" [routerLink]="['/campaigns', campaignId()]">
      Régie
    </a>
    <span aria-disabled="true" title="Bientôt disponible">Chapitres</span>
    <a
      [class.active]="activeSection() === 'locations'"
      [routerLink]="['/campaigns', campaignId(), 'locations']"
    >
      Lieux
    </a>
    <a
      [class.active]="activeSection() === 'npcs'"
      [routerLink]="['/campaigns', campaignId(), 'npcs']"
    >
      PNJ
    </a>
    <span aria-disabled="true" title="Bientôt disponible">PJ</span>
    <span aria-disabled="true" title="Bientôt disponible">Objets</span>
    <span aria-disabled="true" title="Bientôt disponible">Journal</span>
    <a class="home-link" routerLink="/campaigns">Accueil</a>
  </div>
</nav>
