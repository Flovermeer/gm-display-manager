<section
  class="campaign-map"
  [class.campaign-map--compact]="variant() === 'compact'"
  [attr.aria-label]="'Carte de ' + map().campaignName"
>
  <header class="campaign-map__toolbar">
    <ul class="campaign-map__legend" aria-label="Légende de la carte">
      <li><span class="campaign-map__swatch campaign-map__swatch--campaign"></span>Campagne</li>
      <li><span class="campaign-map__swatch campaign-map__swatch--chapter"></span>Chapitre</li>
      <li><span class="campaign-map__swatch campaign-map__swatch--scene"></span>Scène</li>
      <li><span class="campaign-map__swatch campaign-map__swatch--resource"></span>Ressource</li>
    </ul>

    <div class="campaign-map__controls" role="group" aria-label="Contrôles de la carte">
      <button type="button" title="Dézoomer" aria-label="Dézoomer" (click)="zoomOut()">−</button>
      <button type="button" title="Zoomer" aria-label="Zoomer" (click)="zoomIn()">+</button>
      <button
        type="button"
        title="Recentrer la carte"
        aria-label="Recentrer la carte"
        (click)="fitGraph()"
      >
        ⛶
      </button>
      <button type="button" title="Tout replier" aria-label="Tout replier" (click)="collapseAll()">
        ↺
      </button>
    </div>
  </header>

  <div
    #graphHost
    class="campaign-map__graph"
    role="application"
    tabindex="0"
    [attr.aria-label]="'Graphe interactif de ' + map().campaignName"
  ></div>
  <p class="campaign-map__status" aria-live="polite">{{ visibleNodeCount() }} nœuds visibles</p>
</section>
