<main class="configuration-workspace">
  <aside class="configuration-workspace__navigation" aria-label="Catégories de configuration">
    <p class="configuration-workspace__navigation-title">Configuration</p>
    <button
      class="configuration-workspace__navigation-item configuration-workspace__navigation-item--active"
      type="button"
      aria-current="page"
    >
      <span aria-hidden="true">◆</span>
      <span>
        <strong>Objets</strong>
        <small>Types et raretés</small>
      </span>
    </button>
  </aside>

  <div class="configuration-workspace__panel">
    <header class="configuration-workspace__heading">
      <p class="entity-workspace__kicker">Configuration de l’univers</p>
      <h1>Objets</h1>
      <p>Ces valeurs s’appliquent à toutes les campagnes du même univers.</p>
    </header>

    @if (campaign(); as currentCampaign) {
      <app-item-configuration-settings
        [universeId]="currentCampaign.universeId"
        [showHeading]="false"
      />
    }
  </div>
</main>
