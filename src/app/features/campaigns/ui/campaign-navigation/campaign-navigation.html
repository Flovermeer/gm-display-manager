<nav class="campaign-navigation" aria-label="Navigation de la campagne">
  <button
    class="campaign-back"
    type="button"
    title="Revenir à l'écran précédent"
    aria-label="Revenir à l'écran précédent"
    (click)="goBack()"
  >
    <span aria-hidden="true">←</span>
    Retour
  </button>

  <a class="brand-link" routerLink="/campaigns" aria-label="Retour à l'accueil des campagnes">
    <img
      class="app-logo brand-logo"
      src="/brand/beholders-inn-logo.png"
      alt=""
      aria-hidden="true"
    />
    <span class="brand-name">Beholder's Inn</span>
  </a>

  <p class="campaign-name" [title]="campaignName()">{{ campaignName() }}</p>

  <div class="campaign-links">
    <a
      [routerLink]="['/campaigns', campaignId()]"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Régie
    </a>
    <a [routerLink]="['/campaigns', campaignId(), 'scenes']" routerLinkActive="active">Scènes</a>
    <a [routerLink]="['/campaigns', campaignId(), 'chapters']" routerLinkActive="active">
      Chapitres
    </a>
    <a [routerLink]="['/campaigns', campaignId(), 'map']" routerLinkActive="active">Carte</a>
    <a [routerLink]="['/campaigns', campaignId(), 'locations']" routerLinkActive="active">
      Lieux
    </a>
    <a [routerLink]="['/campaigns', campaignId(), 'npcs']" routerLinkActive="active"> PNJ </a>
    <a [routerLink]="['/campaigns', campaignId(), 'bestiary']" routerLinkActive="active">
      Bestiaire
    </a>
    <a [routerLink]="['/campaigns', campaignId(), 'player-characters']" routerLinkActive="active">
      PJ
    </a>
    <a [routerLink]="['/campaigns', campaignId(), 'items']" routerLinkActive="active">Objets</a>
    <a [routerLink]="['/campaigns', campaignId(), 'journal']" routerLinkActive="active">Journal</a>
    <a [routerLink]="['/campaigns', campaignId(), 'tables']" routerLinkActive="active">Tables</a>
    <button
      class="combat-toggle"
      type="button"
      [class.active]="combatOpen()"
      [attr.aria-expanded]="combatOpen()"
      (click)="combatToggle.emit()"
    >
      Combat
      @if (combatantCount() > 0) {
        <span>{{ combatantCount() }}</span>
      }
    </button>
    <a [routerLink]="['/campaigns', campaignId(), 'configuration']" routerLinkActive="active">
      <span aria-hidden="true">⚙</span> Configuration
    </a>
  </div>
</nav>
