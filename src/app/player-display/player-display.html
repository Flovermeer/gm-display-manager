<main class="player-display" [class.blank]="state().mode === 'blank'">
  @if (isPreview) {
    <a class="back-link" routerLink="/control">Retour au panneau MJ</a>
  }

  @let display = state();
  @switch (display.mode) {
    @case ('blank') {
      <div class="blank-screen" aria-label="Écran noir"></div>
    }
    @case ('location') {
      <figure class="location-display">
        <img [src]="display.imagePath" [alt]="display.name ?? 'Illustration du lieu'" />
        @if (display.name) {
          <figcaption>{{ display.name }}</figcaption>
        }
      </figure>
    }
    @case ('npc') {
      <section class="npc-display">
        @if (display.backgroundPath) {
          <img class="npc-background" [src]="display.backgroundPath" alt="" />
        }
        <div class="npc-vignette" aria-hidden="true"></div>
        <img class="npc-portrait" [src]="display.portraitPath" [alt]="display.name" />
        @if (display.idleVideoPath && !videoFailed()) {
          <video
            class="npc-portrait npc-idle-video"
            [src]="display.idleVideoPath"
            [poster]="display.portraitPath"
            autoplay
            muted
            loop
            playsinline
            (error)="handleVideoError()"
          ></video>
        }
        <h1>{{ display.name }}</h1>
      </section>
    }
    @case ('document') {
      <figure class="document-display">
        <img [src]="display.filePath" [alt]="display.name ?? 'Document'" />
        @if (display.name) {
          <figcaption>{{ display.name }}</figcaption>
        }
      </figure>
    }
  }
</main>
