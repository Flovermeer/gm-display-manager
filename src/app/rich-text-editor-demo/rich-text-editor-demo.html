<main class="editor-demo-page">
  <header>
    <div>
      <p class="section-kicker">Prototype technique</p>
      <h1>Notes riches</h1>
      <p>
        Cette page valide l’intégration Angular de Tiptap avant de l’utiliser dans les chapitres.
      </p>
    </div>
    <a routerLink="/campaigns">Retour à l’accueil</a>
  </header>

  <section aria-labelledby="editor-title">
    <h2 id="editor-title">Note de démonstration</h2>
    <app-rich-text-editor [value]="document()" (valueChange)="document.set($event)" />
  </section>

  <details>
    <summary>Voir le JSON enregistré</summary>
    <pre>{{ document() | json }}</pre>
  </details>
</main>
