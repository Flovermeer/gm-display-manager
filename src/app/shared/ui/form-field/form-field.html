<div class="form-field" [class.form-field--invalid]="errorMessage()">
  <label class="form-field__label" [for]="inputId()">{{ label() }}</label>

  @switch (controlType()) {
    @case ('select') {
      <select
        class="form-field__control"
        [id]="inputId()"
        [disabled]="disabled()"
        [attr.aria-invalid]="errorMessage() ? true : null"
        [attr.aria-describedby]="errorMessage() ? inputId() + '-error' : null"
        (change)="updateSelect($event)"
        (blur)="markTouched()"
        (keydown.enter)="enterKey.emit()"
      >
        @if (emptyLabel(); as label) {
          <option
            [value]="emptyOptionValue"
            [selected]="selectValue() === emptyOptionValue"
          >
            {{ label }}
          </option>
        }
        @for (option of options(); track option.value) {
          <option [value]="option.value" [selected]="selectValue() === option.value">
            {{ option.label }}
          </option>
        }
      </select>
    }
    @case ('textarea') {
      <textarea
        class="form-field__control form-field__control--textarea"
        [id]="inputId()"
        [value]="controlValue() ?? ''"
        [disabled]="disabled()"
        [placeholder]="placeholder()"
        [attr.aria-invalid]="errorMessage() ? true : null"
        [attr.aria-describedby]="errorMessage() ? inputId() + '-error' : null"
        (input)="updateText($event)"
        (blur)="markTouched()"
        (keydown.enter)="enterKey.emit()"
      ></textarea>
    }
    @case ('number') {
      <input
        class="form-field__control"
        [id]="inputId()"
        type="number"
        [value]="controlValue() ?? ''"
        [disabled]="disabled()"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [placeholder]="placeholder()"
        [attr.aria-invalid]="errorMessage() ? true : null"
        [attr.aria-describedby]="errorMessage() ? inputId() + '-error' : null"
        (input)="updateNumber($event)"
        (blur)="markTouched()"
        (keydown.enter)="enterKey.emit()"
      />
    }
    @default {
      <input
        class="form-field__control"
        [id]="inputId()"
        [type]="controlType()"
        [value]="controlValue() ?? ''"
        [disabled]="disabled()"
        [placeholder]="placeholder()"
        [attr.autocomplete]="autocomplete()"
        [attr.aria-invalid]="errorMessage() ? true : null"
        [attr.aria-describedby]="errorMessage() ? inputId() + '-error' : null"
        (input)="updateText($event)"
        (blur)="markTouched()"
        (keydown.enter)="enterKey.emit()"
      />
    }
  }

  @if (errorMessage(); as message) {
    <p class="form-field__error field-error" [id]="inputId() + '-error'">{{ message }}</p>
  }
</div>
