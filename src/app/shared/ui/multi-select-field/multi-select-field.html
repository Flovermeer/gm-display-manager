<div class="multi-select-field">
  <label [for]="inputId()">{{ label() }}</label>
  <div class="multi-select-field__control">
    <div class="multi-select-field__values">
      @for (selectedValue of value(); track selectedValue) {
        <app-tag-pill [label]="labelFor(selectedValue)" (remove)="remove(selectedValue)" />
      }
    </div>
    <input
      [id]="inputId()"
      type="search"
      placeholder="Rechercher…"
      [value]="draft()"
      (input)="updateDraft($event)"
    />
    @if (availableOptions().length) {
      <div class="multi-select-field__options">
        @for (option of availableOptions(); track option.value) {
          <button type="button" (click)="add(option.value)">{{ option.label }}</button>
        }
      </div>
    }
  </div>
</div>
